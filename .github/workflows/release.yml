name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          target-branch: main
      - name: Run CI for generated release PRs
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          for (const pr of JSON.parse(process.env.RELEASE_PRS)) {
            execFileSync('gh', ['workflow', 'run', 'ci.yml', '--repo', process.env.GITHUB_REPOSITORY,
              '--ref', pr.headBranchName], { stdio: 'inherit' });
          }
          NODE

  publish:
    needs: release-please
    if: >-
      always() &&
      ((needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true') ||
       (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease))
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check release tag matches package version
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || github.event.release.tag_name }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(process.env.RELEASE_TAG, `v${version}`, 'Release tag must match package.json version');
          NODE
      - run: npm ci
      - name: Validate source
        run: npm run check
      - name: Validate packaged installation
        run: npm run check:package
      - name: Pack release artifact
        run: |
          mkdir "$RUNNER_TEMP/adbdock-release"
          npm pack --pack-destination "$RUNNER_TEMP/adbdock-release"
      - name: Publish with npm trusted publishing
        run: npm publish "$RUNNER_TEMP"/adbdock-release/*.tgz --access public
