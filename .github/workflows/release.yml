name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(process.env.RELEASE_TAG, `v${version}`, 'Release tag must match package.json version');
          NODE
      - run: npm ci
      - name: Validate source
        run: npm run check
      - name: Validate packaged installation
        run: npm run check:package
      - name: Pack release artifact
        run: |
          mkdir "$RUNNER_TEMP/adbdock-release"
          npm pack --pack-destination "$RUNNER_TEMP/adbdock-release"
      - name: Publish with npm trusted publishing
        run: npm publish "$RUNNER_TEMP"/adbdock-release/*.tgz --access public
